[workspace]
resolver = "3"
members = ["crates/core", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/BearBin1215/imageviewer-cleaner"

[workspace.dependencies]
windows = "0.62.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["formatting", "macros"] }

# 体积优先的发布配置
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
