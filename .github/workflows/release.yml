name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 校验 tag 与版本一致
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' |
                  Select-Object -First 1
          if (-not $line) { throw "未能从 Cargo.toml 读到版本号" }
          $ver = $line.Matches[0].Groups[1].Value
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tag -ne $ver) {
            throw "tag $env:GITHUB_REF_NAME 与 Cargo.toml 版本 $ver 不一致"
          }

      - name: 测试
        run: cargo test --workspace --locked

      - name: 构建
        run: cargo build --release -p imageviewer-cleaner-gui --locked

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = "target/release/imageviewer-cleaner.exe"
          $mb = (Get-Item $exe).Length / 1MB
          Write-Host ("产物体积: {0:N2} MB" -f $mb)
          if ($mb -gt 12) { throw "体积超过 12 MB 门禁" }

      - name: 计算校验和
        shell: pwsh
        run: |
          $h = (Get-FileHash "target/release/imageviewer-cleaner.exe" -Algorithm SHA256).Hash
          "$h  imageviewer-cleaner.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "target/release/imageviewer-cleaner.exe" `
            "SHA256SUMS.txt" `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
