name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all --check

      - name: 静态检查
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 单元测试
        run: cargo test --workspace --locked

      - name: 发布构建
        run: cargo build --release -p imageviewer-cleaner-gui --locked

      - name: 体积门禁与单文件校验
        shell: pwsh
        run: |
          $exe = "target/release/imageviewer-cleaner.exe"
          if (-not (Test-Path $exe)) { throw "未找到发布产物" }

          $mb = (Get-Item $exe).Length / 1MB
          Write-Host ("产物体积: {0:N2} MB" -f $mb)
          if ($mb -gt 12) { throw "体积超过 12 MB 门禁" }

          # 单文件校验：发布目录不应出现运行期依赖。
          # .pdb 是调试符号，不参与分发，因此不在检查范围内。
          $stray = Get-ChildItem "target/release" -File |
                    Where-Object { $_.Extension -in ".dll", ".lib", ".exp" }
          if ($stray) {
            Write-Host "发现 sidecar 文件："
            $stray | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "发布产物不是单文件"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: imageviewer-cleaner-x64
          path: target/release/imageviewer-cleaner.exe
